<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>문경 에코월드 3D 지도</title>
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { width: 100vw; height: 100vh; }
    
    /* 디즈니 스타일 귀여운 캐릭터 마커 */
    .character-marker {
      width: 52px;
      height: 52px;
      background-image: url('https://cdn-icons-png.flaticon.com/512/4320/4320337.png');
      background-size: cover;
      background-position: center;
      filter: drop-shadow(0px 6px 10px rgba(0,0,0,0.35));
      transition: all 0.3s ease-out;
    }
    
    /* 상단 안내 바 */
    #status-bar {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      padding: 10px 20px;
      border-radius: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      font-size: 14px;
      font-weight: bold;
      color: #2C3E50;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="status-bar">GPS 위치 수신 준비 중...</div>
  <div id="map"></div>

  <script>
    // 1. Mapbox 토큰 입력
    mapboxgl.accessToken = 'pk.eyJ1IjoicmVzcGVjdDU2MTYiLCJhIjoiY210ejZqMTBpMHBndjJ4b254Mnd4ZzkxeiJ9.VnC7wRYbR9UrSrWouWOwgQ';

    // 2. 문경 에코월드 GeoJSON 데이터
    const ecoWorldData = {
      "type": "FeatureCollection",
      "features": [
        {
          "type": "Feature",
          "properties": { "id": "bldg-museum", "type": "building", "name": "석탄박물관", "height": 14, "color": "#718093" },
          "geometry": { "type": "Polygon", "coordinates": [[[128.13672, 36.65085], [128.13715, 36.65085], [128.13715, 36.65125], [128.13672, 36.65125], [128.13672, 36.65085]]] }
        },
        {
          "type": "Feature",
          "properties": { "id": "bldg-ecotown", "type": "building", "name": "에코타운", "height": 12, "color": "#54A0FF" },
          "geometry": { "type": "Polygon", "coordinates": [[[128.13545, 36.65030], [128.13595, 36.65030], [128.13595, 36.65070], [128.13545, 36.65070], [128.13545, 36.65030]]] }
        },
        {
          "type": "Feature",
          "properties": { "id": "bldg-spider-train", "type": "building", "name": "거미열차 탑승장", "height": 8, "color": "#FF9F1A" },
          "geometry": { "type": "Polygon", "coordinates": [[[128.13725, 36.65135], [128.13755, 36.65135], [128.13755, 36.65160], [128.13725, 36.65160], [128.13725, 36.65135]]] }
        },
        {
          "type": "Feature",
          "properties": { "id": "bldg-giant-forest", "type": "building", "name": "자이언트포레스트", "height": 6, "color": "#2ED573" },
          "geometry": { "type": "Polygon", "coordinates": [[[128.13470, 36.65060], [128.13520, 36.65060], [128.13520, 36.65110], [128.13470, 36.65110], [128.13470, 36.65060]]] }
        },
        {
          "type": "Feature",
          "properties": { "id": "path-main", "type": "path", "name": "주 보행로" },
          "geometry": { "type": "LineString", "coordinates": [[[128.13570, 36.64950], [128.13570, 36.65030], [128.13680, 36.65085]]]}
        }
      ]
    };

    // 3. 문경 에코월드 중심으로 지도 생성 (각도 55도로 3D 뷰 연출)
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/light-v11',
      center: [128.13570, 36.65030],
      zoom: 17,
      pitch: 55,
      bearing: -20
    });

    // 4. 캐릭터 마커 생성
    const markerEl = document.createElement('div');
    markerEl.className = 'character-marker';

    const userMarker = new mapboxgl.Marker({
      element: markerEl,
      anchor: 'bottom'
    }).setLngLat([128.13570, 36.64950]).addTo(map);

    // 5. 지도 레이어 스타일링 (디즈니 파스텔 3D 스타일)
    map.on('load', () => {
      map.setLight({ anchor: 'viewport', color: '#fff3e0', intensity: 0.5, position: [1.5, 90, 40] });

      map.addSource('ecoworld-data', { type: 'geojson', data: ecoWorldData });

      // 보행로
      map.addLayer({
        id: 'ecoworld-paths',
        type: 'line',
        source: 'ecoworld-data',
        filter: ['==', ['get', 'type'], 'path'],
        paint: {
          'line-color': '#FF9F43',
          'line-width': 8,
          'line-opacity': 0.8
        },
        layout: { 'line-cap': 'round', 'line-join': 'round' }
      });

      // 3D 건물
      map.addLayer({
        id: 'ecoworld-buildings-3d',
        type: 'fill-extrusion',
        source: 'ecoworld-data',
        filter: ['==', ['get', 'type'], 'building'],
        paint: {
          'fill-extrusion-color': ['get', 'color'],
          'fill-extrusion-height': ['get', 'height'],
          'fill-extrusion-opacity': 0.9,
          'fill-extrusion-vertical-gradient': true
        }
      });

      // 건물 이름 라벨
      map.addLayer({
        id: 'ecoworld-labels',
        type: 'symbol',
        source: 'ecoworld-data',
        filter: ['has', 'name'],
        layout: {
          'text-field': ['get', 'name'],
          'text-size': 13,
          'text-offset': [0, 1.2],
          'text-anchor': 'top'
        },
        paint: {
          'text-color': '#2C3E50',
          'text-halo-color': '#FFFFFF',
          'text-halo-width': 2
        }
      });

      // 6. 실시간 위치 추적 시작
      startGPS();
    });

    const statusBar = document.getElementById('status-bar');

    function startGPS() {
      if ('geolocation' in navigator) {
        navigator.geolocation.watchPosition(
          (position) => {
            const lng = position.coords.longitude;
            const lat = position.coords.latitude;

            // 캐릭터 위치 업데이트
            userMarker.setLngLat([lng, lat]);

            // 지도 시점을 캐릭터 위치로 부드럽게 이동
            map.easeTo({
              center: [lng, lat],
              duration: 1000
            });

            statusBar.innerText = "📍 실시간 위치 추적 중";
            statusBar.style.background = "rgba(46, 213, 115, 0.9)";
            statusBar.style.color = "#ffffff";
          },
          (error) => {
            console.error(error);
            statusBar.innerText = "⚠️ GPS 권한을 허용해 주세요.";
            statusBar.style.background = "rgba(255, 77, 79, 0.9)";
            statusBar.style.color = "#ffffff";
          },
          { enableHighAccuracy: true }
        );
      } else {
        statusBar.innerText = "이 브라우저는 GPS를 지원하지 않습니다.";
      }
    }
  </script>
</body>
</html>
